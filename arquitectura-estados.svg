<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1080" width="1640" height="1080" font-family="DM Sans, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1640" height="1080" fill="#fff"/><text x="24" y="42" font-size="26" font-weight="bold" fill="#021b47" text-anchor="start">Máquinas de estado, ledger y eventos</text><text x="24" y="66" font-size="13.5" font-weight="normal" fill="#667085" text-anchor="start">Modelo genérico de la industria, simulado en el prototipo (panel de demo, pestaña Core). Un estado solo cambia por una transición permitida.</text><rect x="24" y="84" width="788" height="312" rx="12" fill="#f8fafc" stroke="#d0d5dd" stroke-width="1.4"/><text x="40" y="110" font-size="16" font-weight="bold" fill="#021b47" text-anchor="start">1. Identidad (KYC)</text><text x="40" y="129" font-size="12" font-weight="normal" fill="#667085" text-anchor="start">Una por persona. La respuesta del proveedor se normaliza a estos estados.</text><text x="40" y="382" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">Reintento: la persona corrige. Rechazo: final, solo reabre una persona.</text><polyline points="172,212.0 218,212.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="350,212.0 373,212.0 373,162.0 396,162.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="350,212.0 396,212.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="350,212.0 373,212.0 373,262.0 396,262.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="350,212.0 373,212.0 373,312.0 396,312.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="462.0,194 462.0,180" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="462.0,230 462.0,244" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="396,312.0 284.0,312.0 284.0,230" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/><rect x="40" y="194" width="132" height="36" rx="8" fill="#ffffff" stroke="#667085" stroke-width="1.5"/><text x="106.0" y="216.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Sin iniciar</text><rect x="218" y="194" width="132" height="36" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/><text x="284.0" y="216.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Pendiente</text><rect x="396" y="144" width="132" height="36" rx="8" fill="#e7fbe0" stroke="#3f9e2a" stroke-width="1.5"/><text x="462.0" y="166.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Aprobado</text><rect x="396" y="194" width="132" height="36" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/><text x="462.0" y="216.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">En revisión</text><rect x="396" y="244" width="132" height="36" rx="8" fill="#fde2e2" stroke="#c0392b" stroke-width="1.5"/><text x="462.0" y="266.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Rechazado</text><rect x="396" y="294" width="132" height="36" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/><text x="462.0" y="316.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Reintento</text><rect x="828" y="84" width="788" height="312" rx="12" fill="#f8fafc" stroke="#d0d5dd" stroke-width="1.4"/><text x="844" y="110" font-size="16" font-weight="bold" fill="#021b47" text-anchor="start">2. Titular de la tarjeta</text><text x="844" y="129" font-size="12" font-weight="normal" fill="#667085" text-anchor="start">El emisor revisa por su cuenta. Su veredicto se guarda aparte del KYC.</text><text x="844" y="382" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">Solo "Aprobado" permite emitir. Negado no cierra la cuenta: puede recibir y retirar.</text><polyline points="976,212.0 1022,212.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1154,212.0 1177,212.0 1177,162.0 1200,162.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1154,212.0 1200,212.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1154,212.0 1177,212.0 1177,262.0 1200,262.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1154,212.0 1177,212.0 1177,312.0 1200,312.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1266.0,194 1266.0,180" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1266.0,230 1266.0,244" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1200,312.0 1088.0,312.0 1088.0,230" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/><polyline points="1332,162.0 1378,162.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1332,162.0 1355,162.0 1355,212.0 1378,212.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><rect x="844" y="194" width="132" height="36" rx="8" fill="#ffffff" stroke="#667085" stroke-width="1.5"/><text x="910.0" y="216.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Sin iniciar</text><rect x="1022" y="194" width="132" height="36" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/><text x="1088.0" y="216.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Pendiente</text><rect x="1200" y="144" width="132" height="36" rx="8" fill="#e7fbe0" stroke="#3f9e2a" stroke-width="1.5"/><text x="1266.0" y="166.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Aprobado</text><rect x="1200" y="194" width="132" height="36" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/><text x="1266.0" y="216.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">En revisión</text><rect x="1200" y="244" width="132" height="36" rx="8" fill="#fde2e2" stroke="#c0392b" stroke-width="1.5"/><text x="1266.0" y="266.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Negado</text><rect x="1200" y="294" width="132" height="36" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/><text x="1266.0" y="316.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Falta un dato</text><rect x="1378" y="144" width="132" height="36" rx="8" fill="#fde2e2" stroke="#c0392b" stroke-width="1.5"/><text x="1444.0" y="166.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Bloqueo cumplim.</text><rect x="1378" y="194" width="132" height="36" rx="8" fill="#ffffff" stroke="#667085" stroke-width="1.5"/><text x="1444.0" y="216.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Cerrado</text><rect x="24" y="412" width="788" height="312" rx="12" fill="#f8fafc" stroke="#d0d5dd" stroke-width="1.4"/><text x="40" y="438" font-size="16" font-weight="bold" fill="#021b47" text-anchor="start">3. Tarjeta</text><text x="40" y="457" font-size="12" font-weight="normal" fill="#667085" text-anchor="start">Una por emisión. Se registra quién la bloqueó.</text><text x="40" y="693" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">Una tarjeta virtual se activa al emitirse. El titular no desbloquea lo que bloqueó la empresa.</text><text x="40" y="710" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">Cancelar es final: la reposición es otra tarjeta con otro número.</text><polyline points="172,540.0 218,540.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="350,540.0 574,540.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="350,540.0 373,540.0 373,490.0 396,490.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="396,482.0 284.0,482.0 284.0,522" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/><polyline points="528,490.0 640.0,490.0 640.0,522" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="522" width="132" height="36" rx="8" fill="#ffffff" stroke="#667085" stroke-width="1.5"/><text x="106.0" y="544.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">No activada</text><rect x="218" y="522" width="132" height="36" rx="8" fill="#e7fbe0" stroke="#3f9e2a" stroke-width="1.5"/><text x="284.0" y="544.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Activa</text><rect x="396" y="472" width="132" height="36" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/><text x="462.0" y="494.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Bloqueada</text><rect x="574" y="522" width="132" height="36" rx="8" fill="#fde2e2" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="544.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Cancelada</text><rect x="828" y="412" width="788" height="312" rx="12" fill="#f8fafc" stroke="#d0d5dd" stroke-width="1.4"/><text x="844" y="438" font-size="16" font-weight="bold" fill="#021b47" text-anchor="start">4. Transacción de tarjeta</text><text x="844" y="457" font-size="12" font-weight="normal" fill="#667085" text-anchor="start">Una por autorización. Lo final sigue final, aunque llegue un aviso tardío.</text><text x="844" y="693" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">Autorización y retención son idempotentes por id. Un reembolso es otra transacción, enlazada.</text><text x="844" y="710" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">El clearing puede diferir: libera el resto, toma la diferencia o deja un saldo que se recupera del siguiente pago.</text><polyline points="976,540.0 1022,540.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="976,540.0 999,540.0 999,490.0 1022,490.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1154,540.0 1177,540.0 1177,490.0 1200,490.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1154,540.0 1200,540.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1154,540.0 1177,540.0 1177,590.0 1200,590.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><rect x="844" y="522" width="132" height="36" rx="8" fill="#ffffff" stroke="#667085" stroke-width="1.5"/><text x="910.0" y="544.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Autorización</text><rect x="1022" y="522" width="132" height="36" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/><text x="1088.0" y="544.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Pendiente</text><rect x="1022" y="472" width="132" height="36" rx="8" fill="#fde2e2" stroke="#c0392b" stroke-width="1.5"/><text x="1088.0" y="494.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Rechazada</text><rect x="1200" y="472" width="132" height="36" rx="8" fill="#e7fbe0" stroke="#3f9e2a" stroke-width="1.5"/><text x="1266.0" y="494.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Completada</text><rect x="1200" y="522" width="132" height="36" rx="8" fill="#ffffff" stroke="#667085" stroke-width="1.5"/><text x="1266.0" y="544.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Reversada</text><rect x="1200" y="572" width="132" height="36" rx="8" fill="#ffffff" stroke="#667085" stroke-width="1.5"/><text x="1266.0" y="594.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Vencida</text><rect x="24" y="740" width="788" height="302" rx="12" fill="#f8fafc" stroke="#d0d5dd" stroke-width="1.4"/><text x="40" y="766" font-size="16" font-weight="bold" fill="#021b47" text-anchor="start">5. Fondeo</text><text x="40" y="785" font-size="12" font-weight="normal" fill="#667085" text-anchor="start">Una intención por solicitud. Una solicitud repetida no fondea dos veces.</text><text x="40" y="1011" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">La plataforma es dueña de la intención. El custodio es dueño del movimiento.</text><text x="40" y="1028" font-size="12" font-weight="normal" fill="#334155" text-anchor="start">Solo su confirmación acredita el ledger. La red equivocada es una excepción: no se acredita.</text><polyline points="172,868.0 218,868.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="172,868.0 195,868.0 195,818.0 218,818.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="284.0,836 284.0,850" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="350,868.0 396,868.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><polyline points="350,868.0 373,868.0 373,918.0 396,918.0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="850" width="132" height="36" rx="8" fill="#ffffff" stroke="#667085" stroke-width="1.5"/><text x="106.0" y="872.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Solicitado</text><rect x="218" y="800" width="132" height="36" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/><text x="284.0" y="822.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">En cola</text><rect x="218" y="850" width="132" height="36" rx="8" fill="#eaf1fd" stroke="#1959d2" stroke-width="1.5"/><text x="284.0" y="872.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Detectado</text><rect x="396" y="850" width="132" height="36" rx="8" fill="#e7fbe0" stroke="#3f9e2a" stroke-width="1.5"/><text x="462.0" y="872.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Confirmado</text><rect x="396" y="900" width="132" height="36" rx="8" fill="#fde2e2" stroke="#c0392b" stroke-width="1.5"/><text x="462.0" y="922.5" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="middle">Fallido</text><rect x="828" y="740" width="788" height="302" rx="12" fill="#f8fafc" stroke="#d0d5dd" stroke-width="1.4"/><text x="844" y="766" font-size="16" font-weight="bold" fill="#021b47" text-anchor="start">6. Eventos de proveedores y ledger</text><text x="844" y="792" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="start">Entrada</text><text x="964" y="792" font-size="12.5" font-weight="normal" fill="#334155" text-anchor="start">Se verifica la firma antes de leer. Se guarda con llave única y se responde de inmediato.</text><text x="844" y="814" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="start">Duplicado</text><text x="964" y="814" font-size="12.5" font-weight="normal" fill="#334155" text-anchor="start">Se responde 200 y no se contabiliza otra vez.</text><text x="844" y="836" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="start">Temprano</text><text x="964" y="836" font-size="12.5" font-weight="normal" fill="#334155" text-anchor="start">Refiere algo aún desconocido: espera y reintenta.</text><text x="844" y="858" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="start">Tardío</text><text x="964" y="858" font-size="12.5" font-weight="normal" fill="#334155" text-anchor="start">Si la máquina no permite el cambio, se ignora.</text><text x="844" y="880" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="start">Falla repetida</text><text x="964" y="880" font-size="12.5" font-weight="normal" fill="#334155" text-anchor="start">Reintentos, luego cola muerta. Una persona lo reencola.</text><text x="844" y="902" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="start">Tipo desconocido</text><text x="964" y="902" font-size="12.5" font-weight="normal" fill="#334155" text-anchor="start">Se guarda y se omite. No es un error.</text><text x="844" y="930" font-size="12.5" font-weight="bold" fill="#021b47" text-anchor="start">Ledger</text><text x="964" y="930" font-size="12.5" font-weight="normal" fill="#334155" text-anchor="start">Doble entrada, solo se agrega. Cada evento es un asiento atómico con llave de idempotencia.</text><text x="964" y="949" font-size="12.5" font-weight="normal" fill="#334155" text-anchor="start">Disponible = confirmado − retenciones activas − contabilizado − comisiones − adeudado.</text><text x="964" y="968" font-size="12.5" font-weight="normal" fill="#334155" text-anchor="start">Puede quedar corto. Conciliación diaria con custodio y emisor: una diferencia es excepción.</text></svg>