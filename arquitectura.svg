<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000" font-family="DM Sans, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#021B47"/></marker></defs><rect width="1500" height="1000" fill="#fff"/><text x="30" y="40" font-size="26" font-weight="700" fill="#021B47">Arquitectura: dólares digitales y tarjeta (modelo genérico de la industria)</text><text x="30" y="62" font-size="13" fill="#667085">Proveedores y cifras son supuestos. Todo lo de la derecha está simulado en el prototipo.</text><rect x="20" y="85" width="230" height="640" rx="14" fill="#f6f8fc" stroke="#d0d5dd" stroke-dasharray="5 4"/><text x="34" y="107" font-size="12" font-weight="700" fill="#667085" letter-spacing="1">QUIÉN ENTRA</text><rect x="40" y="120" width="190" height="78" rx="10" fill="#fff" stroke="#1959D2" stroke-width="1.6"/><text x="135.0" y="151.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Empresa (web)</text><text x="135.0" y="168.0" text-anchor="middle" font-size="11" fill="#475467">Alta, KYB, invitar, fondear,</text><text x="135.0" y="182.0" text-anchor="middle" font-size="11" fill="#475467">pagar, spread, aprobar</text><rect x="40" y="260" width="190" height="78" rx="10" fill="#fff" stroke="#1959D2" stroke-width="1.6"/><text x="135.0" y="291.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Empleado o independiente</text><text x="135.0" y="308.0" text-anchor="middle" font-size="11" fill="#475467">Invitación, KYC, saldo,</text><text x="135.0" y="322.0" text-anchor="middle" font-size="11" fill="#475467">tarjeta, retiro (app móvil)</text><rect x="40" y="400" width="190" height="78" rx="10" fill="#fff" stroke="#1959D2" stroke-width="1.6"/><text x="135.0" y="431.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Partner (API)</text><text x="135.0" y="448.0" text-anchor="middle" font-size="11" fill="#475467">Claves, sandbox, webhooks,</text><text x="135.0" y="462.0" text-anchor="middle" font-size="11" fill="#475467">reparto de ingresos</text><rect x="40" y="540" width="190" height="78" rx="10" fill="#fff" stroke="#1959D2" stroke-width="1.6"/><text x="135.0" y="571.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Revisor de cumplimiento</text><text x="135.0" y="588.0" text-anchor="middle" font-size="11" fill="#475467">Cola de revisión manual:</text><text x="135.0" y="602.0" text-anchor="middle" font-size="11" fill="#475467">PEP, listas, retenciones</text><rect x="280" y="85" width="780" height="640" rx="14" fill="#f6f8fc" stroke="#d0d5dd" stroke-dasharray="5 4"/><text x="294" y="107" font-size="12" font-weight="700" fill="#667085" letter-spacing="1">PLATAFORMA (CORE)</text><rect x="300" y="120" width="230" height="86" rx="10" fill="#fff" stroke="#1959D2" stroke-width="1.6"/><text x="415.0" y="155.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Organización y roles</text><text x="415.0" y="172.0" text-anchor="middle" font-size="11" fill="#475467">Empresa raíz: KYB, UBOs, representantes</text><text x="415.0" y="186.0" text-anchor="middle" font-size="11" fill="#475467">admin / finanzas / aprobador / titular</text><text x="415.0" y="200.0" text-anchor="middle" font-size="11" fill="#475467">límites heredados y auditoría</text><rect x="560" y="120" width="230" height="86" rx="10" fill="#fff" stroke="#1959D2" stroke-width="1.6"/><text x="675.0" y="155.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">API y orquestador</text><text x="675.0" y="172.0" text-anchor="middle" font-size="11" fill="#475467">Reglas por país y tipo de pago</text><text x="675.0" y="186.0" text-anchor="middle" font-size="11" fill="#475467">idempotencia por llave</text><text x="675.0" y="200.0" text-anchor="middle" font-size="11" fill="#475467">puerta: sin KYB aprobado no se opera</text><rect x="820" y="120" width="220" height="86" rx="10" fill="#fff" stroke="#1959D2" stroke-width="1.6"/><text x="930.0" y="155.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Identidad y titular</text><text x="930.0" y="172.0" text-anchor="middle" font-size="11" fill="#475467">KYC/KYB: pendiente, reintento, revisión,</text><text x="930.0" y="186.0" text-anchor="middle" font-size="11" fill="#475467">aprobado o rechazado final. Titular:</text><text x="930.0" y="200.0" text-anchor="middle" font-size="11" fill="#475467">veredicto del emisor, guardado aparte</text><rect x="300" y="260" width="230" height="86" rx="10" fill="#fff" stroke="#1959D2" stroke-width="1.6"/><text x="415.0" y="295.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Eventos de proveedores</text><text x="415.0" y="312.0" text-anchor="middle" font-size="11" fill="#475467">Firma, llave única, bandeja</text><text x="415.0" y="326.0" text-anchor="middle" font-size="11" fill="#475467">duplicado: se ignora; temprano: espera</text><text x="415.0" y="340.0" text-anchor="middle" font-size="11" fill="#475467">reintentos y cola muerta con reencolado</text><rect x="560" y="260" width="230" height="100" rx="10" fill="#eaf1ff" stroke="#1959D2" stroke-width="1.6"/><text x="675.0" y="302.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Ledger inmutable, doble entrada</text><text x="675.0" y="319.0" text-anchor="middle" font-size="11" fill="#475467">pendiente = depósitos sin confirmar</text><text x="675.0" y="333.0" text-anchor="middle" font-size="11" fill="#475467">retenido = autorizaciones abiertas</text><text x="675.0" y="347.0" text-anchor="middle" font-size="11" fill="#475467">disponible = confirmado − retenido</text><rect x="820" y="260" width="220" height="86" rx="10" fill="#fff8e1" stroke="#b7791f" stroke-width="1.6"/><text x="930.0" y="295.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Motor de autorización JIT</text><text x="930.0" y="312.0" text-anchor="middle" font-size="11" fill="#475467">Saldo, límites, MCC, país, fraude</text><text x="930.0" y="326.0" text-anchor="middle" font-size="11" fill="#475467">respuesta en ms</text><text x="930.0" y="340.0" text-anchor="middle" font-size="11" fill="#475467">stand-in ante timeout</text><rect x="300" y="410" width="230" height="86" rx="10" fill="#fff" stroke="#1959D2" stroke-width="1.6"/><text x="415.0" y="445.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Tesorería y fondeo</text><text x="415.0" y="462.0" text-anchor="middle" font-size="11" fill="#475467">Intención de fondeo, dirección por red</text><text x="415.0" y="476.0" text-anchor="middle" font-size="11" fill="#475467">acredita solo al confirmar el custodio</text><text x="415.0" y="490.0" text-anchor="middle" font-size="11" fill="#475467">red equivocada: excepción</text><rect x="560" y="430" width="230" height="86" rx="10" fill="#fff" stroke="#1959D2" stroke-width="1.6"/><text x="675.0" y="465.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">FX y precios</text><text x="675.0" y="482.0" text-anchor="middle" font-size="11" fill="#475467">Tasa real, spread explícito, vencimiento</text><text x="675.0" y="496.0" text-anchor="middle" font-size="11" fill="#475467">recarga local y retiro</text><text x="675.0" y="510.0" text-anchor="middle" font-size="11" fill="#475467">spread propio de la empresa (rango)</text><rect x="820" y="410" width="220" height="86" rx="10" fill="#fff" stroke="#1959D2" stroke-width="1.6"/><text x="930.0" y="445.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Clearing y liquidación</text><text x="930.0" y="462.0" text-anchor="middle" font-size="11" fill="#475467">Monto final distinto, incremental,</text><text x="930.0" y="476.0" text-anchor="middle" font-size="11" fill="#475467">reverso, vencimiento, reembolso</text><text x="930.0" y="490.0" text-anchor="middle" font-size="11" fill="#475467">clearing sin auth: suspenso</text><rect x="300" y="570" width="230" height="86" rx="10" fill="#fff" stroke="#1959D2" stroke-width="1.6"/><text x="415.0" y="605.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Conciliación diaria</text><text x="415.0" y="622.0" text-anchor="middle" font-size="11" fill="#475467">Ledger vs custodio vs emisor</text><text x="415.0" y="636.0" text-anchor="middle" font-size="11" fill="#475467">diferencias a excepciones</text><text x="415.0" y="650.0" text-anchor="middle" font-size="11" fill="#475467">nunca ajusta solo; exportable a CSV</text><rect x="560" y="590" width="230" height="66" rx="10" fill="#fff" stroke="#1959D2" stroke-width="1.6"/><text x="675.0" y="615.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Registro de auditoría</text><text x="675.0" y="632.0" text-anchor="middle" font-size="11" fill="#475467">Quién hizo qué y cuándo</text><text x="675.0" y="646.0" text-anchor="middle" font-size="11" fill="#475467">por rol y por empresa</text><rect x="820" y="570" width="220" height="86" rx="10" fill="#fff" stroke="#1959D2" stroke-width="1.6"/><text x="930.0" y="605.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Ingresos</text><text x="930.0" y="622.0" text-anchor="middle" font-size="11" fill="#475467">Fee por pago, spread de la empresa,</text><text x="930.0" y="636.0" text-anchor="middle" font-size="11" fill="#475467">interchange y reparto con partners</text><rect x="1110" y="85" width="370" height="640" rx="14" fill="#f6f8fc" stroke="#d0d5dd" stroke-dasharray="5 4"/><text x="1124" y="107" font-size="12" font-weight="700" fill="#667085" letter-spacing="1">TERCEROS (SIMULADOS)</text><rect x="1130" y="120" width="330" height="70" rx="10" fill="#fde8e8" stroke="#d92d20" stroke-width="1.6"/><text x="1295.0" y="147.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Proveedor de identidad (KYC y KYB)</text><text x="1295.0" y="164.0" text-anchor="middle" font-size="11" fill="#475467">Documentos y biometría; eventos firmados</text><rect x="1130" y="225" width="330" height="70" rx="10" fill="#e8f1ff" stroke="#1959D2" stroke-width="1.6"/><text x="1295.0" y="252.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Custodio institucional</text><text x="1295.0" y="269.0" text-anchor="middle" font-size="11" fill="#475467">Vault por empresa, direcciones por red</text><text x="1295.0" y="283.0" text-anchor="middle" font-size="11" fill="#475467">retiros con aprobación por política</text><rect x="1130" y="330" width="330" height="70" rx="10" fill="#fff8e1" stroke="#b7791f" stroke-width="1.6"/><text x="1295.0" y="357.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Emisor / procesador (Client Managed)</text><text x="1295.0" y="374.0" text-anchor="middle" font-size="11" fill="#475467">Llama en tiempo real: autorizar o declinar</text><text x="1295.0" y="388.0" text-anchor="middle" font-size="11" fill="#475467">PAN y CVV solo en su SDK (PCI)</text><rect x="1130" y="435" width="330" height="60" rx="10" fill="#fff" stroke="#1959D2" stroke-width="1.6"/><text x="1295.0" y="457.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Red de tarjetas y comercio</text><text x="1295.0" y="474.0" text-anchor="middle" font-size="11" fill="#475467">Autorización, clearing, contracargos</text><rect x="1130" y="530" width="330" height="60" rx="10" fill="#fff" stroke="#1959D2" stroke-width="1.6"/><text x="1295.0" y="552.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">On/off-ramp y bancos</text><text x="1295.0" y="569.0" text-anchor="middle" font-size="11" fill="#475467">Wire, ACH o moneda local a USDC y de vuelta</text><rect x="1130" y="625" width="330" height="70" rx="10" fill="#e9fbe5" stroke="#2f8f3a" stroke-width="1.6"/><text x="1295.0" y="652.0" text-anchor="middle" font-size="14" font-weight="700" fill="#021B47">Cadena de bloques (testnet)</text><text x="1295.0" y="669.0" text-anchor="middle" font-size="11" fill="#475467">Prueba pública: transferencia USDC real</text><text x="1295.0" y="683.0" text-anchor="middle" font-size="11" fill="#475467">con link al explorador, o hash simulado</text><path d="M230,159 L300,163" fill="none" stroke="#021B47" stroke-width="1.6" marker-end="url(#a)"/><path d="M230,299 L262,299 L262,187 L300,187" fill="none" stroke="#021B47" stroke-width="1.6" marker-end="url(#a)"/><path d="M230,439 L250,439 L250,222 L600,222 L600,206" fill="none" stroke="#021B47" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><path d="M530,163 L560,163" fill="none" stroke="#021B47" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><path d="M790,163 L820,163" fill="none" stroke="#021B47" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><path d="M1040,150 L1130,155" fill="none" stroke="#d92d20" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><circle cx="1085" cy="134" r="11" fill="#1959D2"/><text x="1085" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="1085" y="176" text-anchor="middle" font-size="11" fill="#667085" font-style="italic">webhook firmado</text><path d="M675,206 L675,260" fill="none" stroke="#021B47" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><path d="M530,303 L560,303" fill="none" stroke="#021B47" stroke-width="1.6" marker-end="url(#a)"/><path d="M790,310 L820,310" fill="none" stroke="#021B47" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><circle cx="805" cy="296" r="11" fill="#1959D2"/><text x="805" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><path d="M1040,310 L1090,310 L1090,365 L1130,365" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><circle cx="1090" cy="345" r="11" fill="#1959D2"/><text x="1090" y="349" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><path d="M1130,260 L1075,260 L1075,240 L450,240 L450,260" fill="none" stroke="#2f8f3a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><path d="M415,346 L415,410" fill="none" stroke="#021B47" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><path d="M675,430 L675,360" fill="none" stroke="#021B47" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><path d="M675,516 L675,545 L1000,545 L1000,496" fill="none" stroke="#021B47" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><path d="M1040,455 L1130,465" fill="none" stroke="#021B47" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><circle cx="1085" cy="443" r="11" fill="#1959D2"/><text x="1085" y="447" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><path d="M1130,560 L1070,560 L1070,520 L415,520 L415,496" fill="none" stroke="#021B47" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><circle cx="850" cy="520" r="11" fill="#1959D2"/><text x="850" y="524" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><path d="M1130,660 L1090,660 L1090,625 L1060,625" fill="none" stroke="#2f8f3a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><path d="M415,570 L415,540" fill="none" stroke="#021B47" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><path d="M230,579 L300,600" fill="none" stroke="#021B47" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><circle cx="545" cy="145" r="11" fill="#1959D2"/><text x="545" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><circle cx="1100" cy="545" r="11" fill="#1959D2"/><text x="1100" y="549" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text><text x="30" y="770" font-size="15" font-weight="700" fill="#021B47">Cómo se mueve el dinero</text><circle cx="40" cy="800" r="11" fill="#1959D2"/><text x="40" y="804" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="60" y="804" font-size="12" fill="#344054">Alta: la empresa pasa KYB y los representantes KYC. Sin eso no se opera. El emisor decide aparte sobre el titular.</text><circle cx="40" cy="826" r="11" fill="#1959D2"/><text x="40" y="830" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="60" y="830" font-size="12" fill="#344054">Fondeo: USDC o wire llega al vault; solo la confirmación del custodio acredita, primero como pendiente.</text><circle cx="40" cy="852" r="11" fill="#1959D2"/><text x="40" y="856" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="60" y="856" font-size="12" fill="#344054">Pago: la empresa asigna saldo o programa una fecha; si falla KYC o hay revisión, queda retenido.</text><circle cx="40" cy="878" r="11" fill="#1959D2"/><text x="40" y="882" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="60" y="882" font-size="12" fill="#344054">Autorización: el emisor llama al core; el core aplica reglas y crea un hold en el ledger en ms.</text><circle cx="40" cy="904" r="11" fill="#1959D2"/><text x="40" y="908" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="60" y="908" font-size="12" fill="#344054">Clearing: llega el monto final; se debita, se libera el resto o se cobra la diferencia.</text><circle cx="40" cy="930" r="11" fill="#1959D2"/><text x="40" y="934" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text><text x="60" y="934" font-size="12" fill="#344054">Liquidación diaria: USDC a USD, al emisor y la red. Retiro: cotización vigente, débito atómico, banco local.</text><text x="1010" y="770" font-size="15" font-weight="700" fill="#021B47">Casos borde simulables en el panel de demo</text><text x="1010" y="795" font-size="12" fill="#344054">• KYC rechazado, ilegible o en revisión manual</text><text x="1010" y="813" font-size="12" fill="#344054">• Pago en revisión y saldo pendiente</text><text x="1010" y="831" font-size="12" fill="#344054">• Cotización vencida y retiro bancario fallido</text><text x="1010" y="849" font-size="12" fill="#344054">• Tarjeta declinada: fondos, MCC, país, CVV/3DS, fraude</text><text x="1010" y="867" font-size="12" fill="#344054">• Timeout: stand-in del emisor hasta un límite</text><text x="1010" y="885" font-size="12" fill="#344054">• Evento duplicado, inválido, temprano o tardío; clearing sin auth</text><text x="1010" y="903" font-size="12" fill="#344054">• Depósito en red equivocada; caída del custodio</text><text x="30" y="960" font-size="11" fill="#98a2b3">Colores: rojo = datos personales (con el proveedor de identidad), amarillo = datos de tarjeta (PCI, solo el emisor), azul = fondos y custodia, verde = cadena de bloques.</text></svg>